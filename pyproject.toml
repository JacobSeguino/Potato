[project]
name = "Potato"
version = "1.0.0"
authors = [
  { name="Jacob Seguino", email="jacob.seguino@gmail.com" },
]
description = "A small python package to run the one page RPG 'Potato'"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/JacobSeguino/Potato/"
Issues = "https://github.com/JacobSeguino/Potato/issues"
